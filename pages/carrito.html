<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | TurnoExtra</title>
    <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <header class="header">
        <nav class="navbar navbar-expand-lg"
            aria-label="Navegación principal">

            <!-- Logo de TurnoExtra -->
            <a href="../index.html" class="logo navbar-brand">
                <span class="logo-icon">🎲</span>
                turnoextra<span class="logo-dot">.</span>
            </a>

            <!-- Botón hamburguesa para pantallas pequeñas -->
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal"
                    aria-expanded="false"
                    aria-label="Mostrar u ocultar menú">

                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Enlaces de navegación -->
            <div class="collapse navbar-collapse"
                id="menuPrincipal">

                <ul class="navbar-nav nav-links ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="estrategia.html">
                            Estrategia
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="familiares.html">
                            Familiares
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="creatividad.html">
                            Creatividad
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="fiesta.html">
                            Fiesta
                        </a>
                    </li>

                    <!-- Opciones para visitantes -->
                    <li class="nav-item" data-session="guest">
                        <a class="nav-link" href="registro.html">
                            Registro
                        </a>
                    </li>

                    <li class="nav-item" data-session="guest">
                        <a class="nav-link" href="login.html">
                            Iniciar sesión
                        </a>
                    </li>

                    <!-- Carrito exclusivo del cliente -->
                    <li class="nav-item d-none" data-session="cliente">
                        <a class="nav-link" href="carrito.html" aria-current="page">
                            🛒 Carrito
                        </a>
                    </li>

                    <!-- Perfil de usuarios autenticados -->
                    <li class="nav-item d-none" data-session="profile">
                        <a class="nav-link" href="perfil.html">
                            Mi perfil
                        </a>
                    </li>

                    <!-- Administración -->
                    <li class="nav-item d-none" data-session="admin">
                        <a class="nav-link" href="admin.html">
                            Administración
                        </a>
                    </li>

                    <!-- Cerrar sesión -->
                    <li class="nav-item d-none" data-session="logout">
                        <button type="button" class="nav-link session-logout">
                            Cerrar sesión
                        </button>
                    </li>

                </ul>

            </div>
        </nav>
    </header>

    <main id="protected-content" class="container py-5 d-none">
        <h1>Carrito</h1>
    </main>
    <!-- Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Validación de inicio de sesión -->
    <script src="../js/sesion.js" defer></script>
    <!-- Validación de carrito -->
    <script src="../js/pagina-carrito.js" defer></script>
</body>
</html>
